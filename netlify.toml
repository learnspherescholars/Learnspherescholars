[build]
  publish = "."
  functions = "netlify/functions"

# Basic security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Icons/images rarely change — cache them for a year. If you ever replace a
# file at the same path, rename it (e.g. icon-192-v2.png) so browsers pick
# up the new version instead of an old cached one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
